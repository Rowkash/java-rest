# App Configuration
spring.application.name=portfolios-postgres
server.port=4000
# Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/main
spring.datasource.username=admin
spring.datasource.password=admin
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Spring Session Redis
spring.session.data.redis.namespace=spring:session
spring.session.data.redis.repository-type=indexed
# JWT Auth
auth.jwtSecret=billyherringtonvsvandarkholmebillyherringtonvsvandarkholme
auth.jwtExpiration=86400000
# OpenAPI / Swagger
springdoc.swagger-ui.path=/docs
spring.jackson.default-property-inclusion=non_null